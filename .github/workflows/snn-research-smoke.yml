name: SNN research smoke tests

on:
  push:
    branches:
      - research/snn-baseline
    paths:
      - 'doom_learning_v6/conditioning_analysis.py'
      - 'doom_learning_v6/conditioning_strict.py'
      - 'doom_learning_v6/conditioning_strict_analysis.py'
      - 'doom_learning_v6/cue_screen.py'
      - 'doom_learning_v6/cue_screen_analysis.py'
      - 'doom_learning_v6/eligibility_model.py'
      - 'doom_learning_v6/model_registry.py'
      - 'doom_learning_v6/research_report.py'
      - 'doom_learning_v6/stimuli.py'
      - 'scripts/snn_research_local.sh'
      - 'tests/test_doom_learning_v6_conditioning.py'
      - 'tests/test_doom_learning_v6_conditioning_strict.py'
      - 'tests/test_doom_learning_v6_cue_screen.py'
      - 'tests/test_doom_learning_v6_research_report.py'
      - '.github/workflows/snn-research-smoke.yml'
  pull_request:
    paths:
      - 'doom_learning_v6/conditioning_analysis.py'
      - 'doom_learning_v6/conditioning_strict.py'
      - 'doom_learning_v6/conditioning_strict_analysis.py'
      - 'doom_learning_v6/cue_screen.py'
      - 'doom_learning_v6/cue_screen_analysis.py'
      - 'doom_learning_v6/eligibility_model.py'
      - 'doom_learning_v6/model_registry.py'
      - 'doom_learning_v6/research_report.py'
      - 'doom_learning_v6/stimuli.py'
      - 'scripts/snn_research_local.sh'
      - 'tests/test_doom_learning_v6_conditioning.py'
      - 'tests/test_doom_learning_v6_conditioning_strict.py'
      - 'tests/test_doom_learning_v6_cue_screen.py'
      - 'tests/test_doom_learning_v6_research_report.py'
      - '.github/workflows/snn-research-smoke.yml'

jobs:
  research-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check research modules
        run: >-
          python -m py_compile
          doom_learning_v6/conditioning_strict.py
          doom_learning_v6/conditioning_strict_analysis.py
          doom_learning_v6/cue_screen.py
          doom_learning_v6/cue_screen_analysis.py
          doom_learning_v6/eligibility_model.py
          doom_learning_v6/model_registry.py
          doom_learning_v6/research_report.py
          doom_learning_v6/stimuli.py
      - name: Syntax check local runner
        run: bash -n scripts/snn_research_local.sh
      - run: python -m pip install --disable-pip-version-check pytest
      - run: >-
          python -m pytest
          tests/test_doom_learning_v6_conditioning.py
          tests/test_doom_learning_v6_conditioning_strict.py
          tests/test_doom_learning_v6_cue_screen.py
          tests/test_doom_learning_v6_research_report.py
          -q
